<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64" role="img" aria-labelledby="title desc">
  <title id="title">README made with beautify-github-readme</title>
  <desc id="desc">Compact project-native signature badge linking to the beautify-github-readme skill repository.</desc>

  <defs>
    <linearGradient id="sigBusGrad" gradientUnits="userSpaceOnUse" x1="24" y1="45" x2="24" y2="19">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Self-contained dark slate badge surface -->
  <rect width="420" height="64" rx="12" fill="#0B1117"/>
  <rect x="1" y="1" width="418" height="62" rx="11" fill="none" stroke="#1F2D3D" stroke-width="1.5"/>

  <!-- Mini silicon-to-software signal bus motif -->
  <line x1="24" y1="19" x2="24" y2="45" stroke="url(#sigBusGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="45" r="3.5" fill="#F59E0B"/>
  <circle cx="24" cy="19" r="3.5" fill="#22D3EE"/>

  <!-- Shared information pattern in GitHub Primer typography -->
  <text x="44" y="25" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#8B949E">README MADE WITH</text>
  <text x="44" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F0F6FC">beautify-github-readme</text>

  <!-- Restrained outbound-arrow cue -->
  <rect x="372" y="17" width="30" height="30" rx="8" fill="#111A24" stroke="#223A4A" stroke-width="1.3"/>
  <path d="M382 37 L392 27 M385 27 H392 V34" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
